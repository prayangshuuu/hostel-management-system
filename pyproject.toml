[project]
name = "hostel-management-system"
version = "1.0.0"
description = "Hostel Management System API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.9.4",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.17",
    "locust>=2.47.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytailwindcss>=0.4.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "S",
    "ASYNC",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["E402"]
"alembic/versions/*" = ["E501"]
"app/api/*" = ["B008"]
"app/web/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
markers = [
    "postgres: marks tests that require PostgreSQL (deselect with '-m \"not postgres\"')",
]

[tool.coverage.report]
fail_under = 90
