<div id="toast-{{ id or 'msg' }}" class="pointer-events-auto w-full max-w-sm rounded-xl p-4 shadow-lg ring-1 transition-all duration-300 ease-out transform translate-y-0
    {% if type == 'error' %}
        bg-rose-50 text-rose-900 ring-rose-200
    {% elif type == 'warning' %}
        bg-amber-50 text-amber-900 ring-amber-200
    {% else %}
        bg-emerald-50 text-emerald-900 ring-emerald-200
    {% endif %}" role="status">
    <div class="flex items-start">
        <div class="flex-shrink-0">
            {% if type == 'error' %}
            <svg class="h-5 w-5 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            {% else %}
            <svg class="h-5 w-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            {% endif %}
        </div>
        <div class="ml-3 w-0 flex-1 pt-0.5">
            <p class="text-sm font-medium">{{ message }}</p>
        </div>
        <div class="ml-4 flex flex-shrink-0">
            <button type="button" onclick="this.closest('[role=status]').remove()"
                class="inline-flex rounded-md text-zinc-400 hover:text-zinc-600 focus:outline-none">
                <span class="sr-only">Close</span>
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</div>
