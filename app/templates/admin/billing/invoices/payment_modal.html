<div class="fixed inset-0 bg-zinc-900/60 backdrop-blur-sm transition-opacity"></div>

<div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-zinc-200">
            <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-200 bg-zinc-50">
                <h3 class="text-base font-semibold leading-6 text-zinc-900">Record Payment</h3>
                <button type="button" onclick="closeModal()" class="text-zinc-400 hover:text-zinc-500 focus:outline-none">
                    <span class="sr-only">Close</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            {% if error %}
            <div class="mx-6 mt-4 rounded-lg bg-rose-50 border border-rose-200 p-3.5 text-xs text-rose-800 font-medium" role="alert">
                <div class="flex items-center gap-2">
                    <svg class="h-4 w-4 text-rose-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>{{ error }}</span>
                </div>
            </div>
            {% endif %}

            <div class="mx-6 mt-4 rounded-xl bg-indigo-50/60 border border-indigo-100 p-3.5">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-zinc-600">Remaining Balance:</span>
                    <span class="font-bold text-indigo-900 text-sm">{{ invoice.balance|currency }}</span>
                </div>
            </div>

            <form hx-post="/admin/billing/invoices/{{ invoice.id }}/payment" hx-target="#modal-container" hx-disabled-elt="button[type=submit]" class="p-6 space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <label for="payment_amount" class="block text-xs font-medium text-zinc-700 mb-1">Amount ($) *</label>
                    <input type="number" step="0.01" min="0.01" max="{{ invoice.balance }}" id="payment_amount" name="amount" required
                        value="{{ invoice.balance }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 font-bold">
                    <p class="mt-1 text-[11px] text-zinc-500">Overpayment is blocked. Max allowed: {{ invoice.balance|currency }}</p>
                </div>

                <div>
                    <label for="payment_method" class="block text-xs font-medium text-zinc-700 mb-1">Payment Method *</label>
                    <select id="payment_method" name="method" required
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        {% for m in payment_methods %}
                        <option value="{{ m.value }}">{{ m.value|replace('_', ' ')|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="reference" class="block text-xs font-medium text-zinc-700 mb-1">Reference / Transaction ID</label>
                    <input type="text" id="reference" name="reference" placeholder="e.g. Bank slip #, Check #"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="notes" class="block text-xs font-medium text-zinc-700 mb-1">Notes</label>
                    <input type="text" id="notes" name="notes" placeholder="Optional notes"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="pt-4 border-t border-zinc-200 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeModal()"
                        class="rounded-lg border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-50 transition">
                        Cancel
                    </button>
                    <button type="submit"
                        class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 transition">
                        Submit Payment
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
