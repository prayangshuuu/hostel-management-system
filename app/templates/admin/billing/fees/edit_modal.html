<div class="fixed inset-0 bg-zinc-900/60 backdrop-blur-sm transition-opacity"></div>

<div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-zinc-200">
            <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-200 bg-zinc-50">
                <h3 class="text-base font-semibold leading-6 text-zinc-900">Edit Fee Structure</h3>
                <button type="button" onclick="closeModal()" class="text-zinc-400 hover:text-zinc-500 focus:outline-none">
                    <span class="sr-only">Close</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            {% if error %}
            <div class="mx-6 mt-4 rounded-lg bg-rose-50 border border-rose-200 p-3 text-xs text-rose-800" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form hx-post="/admin/billing/fees/{{ fee.id }}/edit" hx-target="#modal-container" class="p-6 space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <label for="edit_fee_amount" class="block text-xs font-medium text-zinc-700 mb-1">Monthly Amount ($) *</label>
                    <input type="number" step="0.01" min="0" id="edit_fee_amount" name="amount" required value="{{ fee.amount }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="edit_fee_desc" class="block text-xs font-medium text-zinc-700 mb-1">Description</label>
                    <input type="text" id="edit_fee_desc" name="description" value="{{ fee.description or '' }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="flex items-center gap-2">
                    <input type="checkbox" id="is_active" name="is_active" value="true" {% if fee.is_active %}checked{% endif %}
                        class="rounded border-zinc-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="is_active" class="text-xs font-medium text-zinc-700">Active (applies to future invoices)</label>
                </div>

                <div class="pt-4 border-t border-zinc-200 flex items-center justify-between">
                    <button type="submit"
                        hx-post="/admin/billing/fees/{{ fee.id }}/delete"
                        hx-confirm="Are you sure you want to delete this fee structure?"
                        class="text-xs text-rose-600 hover:text-rose-800 font-medium">
                        Delete Fee
                    </button>
                    <div class="flex gap-2">
                        <button type="button" onclick="closeModal()"
                            class="rounded-lg border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-50 transition">
                            Cancel
                        </button>
                        <button type="submit"
                            class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 transition">
                            Save Changes
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
