<div class="rounded-2xl bg-emerald-50 border border-emerald-200 p-6 text-center space-y-4">
    <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>

    <div>
        <h3 class="text-base font-bold text-emerald-900">Invoices Successfully Generated</h3>
        <p class="text-xs text-emerald-700 mt-1">
            Created <span class="font-bold">{{ generated_count }}</span> invoices totaling <span class="font-bold">{{ total_amount|currency }}</span>.
            {% if skipped_count > 0 %}
            ({{ skipped_count }} duplicate allocations skipped).
            {% endif %}
        </p>
    </div>

    <div class="pt-2 flex justify-center gap-3">
        <a href="/admin/billing/invoices"
            class="rounded-lg bg-emerald-600 px-4 py-2 text-xs font-semibold text-white hover:bg-emerald-700 transition">
            View All Invoices
        </a>
        <a href="/admin/billing/generate"
            class="rounded-lg border border-emerald-300 bg-white px-4 py-2 text-xs font-medium text-emerald-800 hover:bg-emerald-50 transition">
            Generate Another
        </a>
    </div>
</div>
