{% extends "admin/layout.html" %}

{% block title %}Generate Invoices — {{ app_name }}{% endblock %}

{% block content %}
<div class="px-4 sm:px-6 lg:px-8 py-8 max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Generate Invoices</h1>
        <p class="mt-1 text-sm text-zinc-500">
            Bulk-generate monthly room fee invoices for students with active allocations. Includes a non-destructive preview step.
        </p>
    </div>

    <!-- Generator Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6 sm:p-8">
        <form hx-post="/admin/billing/generate/preview" hx-target="#preview-step-container" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div>
                <label for="hostel_select" class="block text-sm font-medium text-zinc-700 mb-1">Target Hostel *</label>
                <select id="hostel_select" name="hostel_id" required
                    class="w-full rounded-lg border border-zinc-300 px-3.5 py-2.5 text-sm focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">-- Choose Hostel --</option>
                    {% for h in hostels %}
                    <option value="{{ h.id }}">{{ h.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label for="period_start" class="block text-xs font-medium text-zinc-700 mb-1">Period Start *</label>
                    <input type="date" id="period_start" name="period_start" required value="{{ today }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="period_end" class="block text-xs font-medium text-zinc-700 mb-1">Period End *</label>
                    <input type="date" id="period_end" name="period_end" required value="{{ today }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="due_date" class="block text-xs font-medium text-zinc-700 mb-1">Payment Due Date *</label>
                    <input type="date" id="due_date" name="due_date" required value="{{ today }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 transition">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    Preview Invoices
                </button>
            </div>
        </form>

        <!-- Preview & Confirm Target -->
        <div id="preview-step-container" class="mt-8">
            <!-- Dynamically populated preview card or result card -->
        </div>
    </div>
</div>
{% endblock %}
