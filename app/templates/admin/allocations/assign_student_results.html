{% if students %}
<div class="divide-y divide-zinc-100 max-h-48 overflow-y-auto rounded-lg border border-zinc-200 bg-white">
    {% for s in students %}
    <label class="flex items-center justify-between p-2.5 hover:bg-indigo-50 cursor-pointer transition">
        <div class="flex items-center gap-2">
            <input type="radio" name="student_id" value="{{ s.id }}" required class="text-indigo-600 focus:ring-indigo-500">
            <div>
                <span class="text-xs font-semibold text-zinc-900">{{ s.full_name }}</span>
                <span class="text-[11px] text-zinc-500">({{ s.student_no }} • {{ s.department }})</span>
            </div>
        </div>
        <span class="text-[10px] uppercase font-bold text-zinc-400">{{ s.gender.value }}</span>
    </label>
    {% endfor %}
</div>
{% else %}
<div class="p-3 text-center text-xs text-zinc-500 border border-dashed border-zinc-200 rounded-lg">
    No unallocated students match your query.
</div>
{% endif %}
