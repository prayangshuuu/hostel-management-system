<div class="fixed inset-0 bg-zinc-900/60 backdrop-blur-sm transition-opacity"></div>

<div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-zinc-200">
            <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-200 bg-zinc-50">
                <h3 class="text-base font-semibold leading-6 text-zinc-900">Edit Student Profile</h3>
                <button type="button" onclick="closeModal()" class="text-zinc-400 hover:text-zinc-500 focus:outline-none">
                    <span class="sr-only">Close</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            {% if error %}
            <div class="mx-6 mt-4 rounded-lg bg-rose-50 border border-rose-200 p-3 text-xs text-rose-800" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form hx-post="/admin/students/{{ student.id }}/edit" hx-target="#modal-container" class="p-6 space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <label for="full_name" class="block text-xs font-medium text-zinc-700 mb-1">Full Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ student.full_name }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="department" class="block text-xs font-medium text-zinc-700 mb-1">Department</label>
                        <input type="text" id="department" name="department" value="{{ student.department }}"
                            class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label for="year" class="block text-xs font-medium text-zinc-700 mb-1">Year</label>
                        <select id="year" name="year"
                            class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                            {% for y in range(1, 7) %}
                            <option value="{{ y }}" {% if student.year == y %}selected{% endif %}>Year {{ y }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="phone" class="block text-xs font-medium text-zinc-700 mb-1">Phone</label>
                        <input type="text" id="phone" name="phone" value="{{ student.phone or '' }}"
                            class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label for="guardian_phone" class="block text-xs font-medium text-zinc-700 mb-1">Guardian Phone</label>
                        <input type="text" id="guardian_phone" name="guardian_phone" value="{{ student.guardian_phone }}"
                            class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label for="guardian_name" class="block text-xs font-medium text-zinc-700 mb-1">Guardian Name</label>
                    <input type="text" id="guardian_name" name="guardian_name" value="{{ student.guardian_name }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="emergency_contact" class="block text-xs font-medium text-zinc-700 mb-1">Emergency Contact</label>
                    <input type="text" id="emergency_contact" name="emergency_contact" value="{{ student.emergency_contact }}"
                        class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="pt-4 border-t border-zinc-200 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeModal()"
                        class="rounded-lg border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-50 transition">
                        Cancel
                    </button>
                    <button type="submit"
                        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 transition">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
