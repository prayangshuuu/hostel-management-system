<div class="fixed inset-0 bg-zinc-900/60 backdrop-blur-sm transition-opacity"></div>

<div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-zinc-200">
            <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-200 bg-zinc-50">
                <h3 class="text-base font-semibold leading-6 text-zinc-900">Add New Student</h3>
                <button type="button" onclick="closeModal()" class="text-zinc-400 hover:text-zinc-500 focus:outline-none">
                    <span class="sr-only">Close</span>
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            {% if error %}
            <div class="mx-6 mt-4 rounded-lg bg-rose-50 border border-rose-200 p-3 text-xs text-rose-800" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form hx-post="/admin/students" hx-target="#modal-container" class="p-6 space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">Account Information</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="full_name" class="block text-xs font-medium text-zinc-700 mb-1">Full Name *</label>
                            <input type="text" id="full_name" name="full_name" required value="{{ form_data.full_name if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="email" class="block text-xs font-medium text-zinc-700 mb-1">Email Address *</label>
                            <input type="email" id="email" name="email" required value="{{ form_data.email if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="phone" class="block text-xs font-medium text-zinc-700 mb-1">Phone Number</label>
                            <input type="text" id="phone" name="phone" placeholder="+1234567890" value="{{ form_data.phone if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="password" class="block text-xs font-medium text-zinc-700 mb-1">Temporary Password (optional)</label>
                            <input type="password" id="password" name="password" placeholder="Auto-generated if empty"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <div class="pt-2 border-t border-zinc-100">
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">Academic & Profile Details</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="student_no" class="block text-xs font-medium text-zinc-700 mb-1">Student ID / Number *</label>
                            <input type="text" id="student_no" name="student_no" required value="{{ form_data.student_no if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 font-mono">
                        </div>
                        <div>
                            <label for="gender" class="block text-xs font-medium text-zinc-700 mb-1">Gender *</label>
                            <select id="gender" name="gender" required
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="male" {% if form_data and form_data.gender == 'male' %}selected{% endif %}>Male</option>
                                <option value="female" {% if form_data and form_data.gender == 'female' %}selected{% endif %}>Female</option>
                                <option value="other" {% if form_data and form_data.gender == 'other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div>
                            <label for="department" class="block text-xs font-medium text-zinc-700 mb-1">Department *</label>
                            <input type="text" id="department" name="department" required placeholder="e.g. Electrical Engineering" value="{{ form_data.department if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="year" class="block text-xs font-medium text-zinc-700 mb-1">Year of Study *</label>
                            <select id="year" name="year" required
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                                {% for y in range(1, 7) %}
                                <option value="{{ y }}" {% if form_data and form_data.year == y %}selected{% endif %}>Year {{ y }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="pt-2 border-t border-zinc-100">
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">Guardian & Emergency Contacts</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="guardian_name" class="block text-xs font-medium text-zinc-700 mb-1">Guardian Name *</label>
                            <input type="text" id="guardian_name" name="guardian_name" required value="{{ form_data.guardian_name if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="guardian_phone" class="block text-xs font-medium text-zinc-700 mb-1">Guardian Phone *</label>
                            <input type="text" id="guardian_phone" name="guardian_phone" required placeholder="+1234567890" value="{{ form_data.guardian_phone if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="md:col-span-2">
                            <label for="emergency_contact" class="block text-xs font-medium text-zinc-700 mb-1">Emergency Contact Number *</label>
                            <input type="text" id="emergency_contact" name="emergency_contact" required placeholder="+1234567890" value="{{ form_data.emergency_contact if form_data else '' }}"
                                class="w-full text-sm rounded-lg border border-zinc-300 px-3 py-2 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-zinc-200 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeModal()"
                        class="rounded-lg border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-50 transition">
                        Cancel
                    </button>
                    <button type="submit"
                        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 transition">
                        Create Student
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
